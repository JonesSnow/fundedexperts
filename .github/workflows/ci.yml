## 5. Test Separation

### 5.1 Static Validation Job
- Runs on every push and PR
- No DATABASE_URL required
- Validates TypeScript, ESLint, Prisma, build
- Fast (~2-3 minutes)
- Prevents broken code from reaching DB tests

### 5.2 Database Tests Job
- Runs only on PRs (not direct pushes to master)
- Requires `TEST_DATABASE_URL` secret
- Cleans DB before and after (via `scripts/cleanup-db.ts`)
- Runs all DB test suites sequentially
- Does NOT run against production database
- Uses test-only environment variables (`TEST_` prefix)

### 5.3 Index Verification Job
- Runs only on PRs
- Requires `TEST_DATABASE_URL` secret
- Verifies monitoring job partial unique index
- Cleans DB after completion

### 5.4 Future Jobs (Not Yet Implemented)
- **E2E Tests (browser):** Requires Playwright, running dev server, `TEST_DATABASE_URL`
- **Security Scan:** Requires `npm audit`, Snyk, or similar
- **Load Tests:** Requires dedicated test environment

### 5.5 Production Data Protection
| Protection | Implementation |
|------------|---------------|
| No prod DB URL in CI | `TEST_DATABASE_URL` is separate |
| DB cleanup before tests | `scripts/cleanup-db.ts` runs before all DB tests |
| DB cleanup after tests | `scripts/cleanup-db.ts` runs after all DB tests (`if: always()`) |
| Test prefix pattern | All test IDs use prefixes (P16-, P17-, E2E-, acc-) |
| No DELETE in production | Cleanup script only runs with TEST_DATABASE_URL |

