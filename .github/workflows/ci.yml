## 4. `tsconfig.json` Script Exclusion — Documented

### Current State

`tsconfig.json` line 33: `"exclude": ["node_modules", "scripts"]`

### Why Scripts Are Excluded

Scripts in `scripts/` use CommonJS `require()` syntax (not ESM `import`). The TypeScript `strict` mode enabled in `tsconfig.json` conflicts with this pattern, producing type errors.

### Validation Path for Scripts

| Script | How Validated | Status |
|--------|--------------|--------|
| `scripts/run-tests.js` | ESLint whitelisted in `eslint.config.mjs` line 17-19 | PASS |
| `scripts/cleanup-db.ts` | Runtime execution test (run before each test suite) | PASS |
| `scripts/verify-monitoring-job-index.ts` | Runtime execution test (index verification) | PARTIAL |
| `scripts/neon-check.ts` | Runtime execution test | PASS |

### Why Not Fix in tsconfig.json

Changing `scripts/` to use ESM `import` would require:
1. Converting `scripts/run-tests.js` from `.js` to `.mts` or `.mjs`
2. Removing the `dotenv` inline loader (since ESM has different env loading)
3. Breaking the current Windows PowerShell test runner pattern
4. Risk of breaking the test infrastructure that all other WPs depend on

**Decision:** Scripts remain excluded from strict type checking. They are validated by:
1. Successful runtime execution (all scripts tested before Phase 25)
2. ESLint (with targeted override for `no-require-imports`)
3. Manual code review

This exclusion is intentional and documented, not a suppression of errors.

